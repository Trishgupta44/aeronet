<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroNet: airflow explorer</title>
<meta name="description" content="Airfoil flow explorer: pick a shape and an angle and see the pressure field and lift. Inviscid, subsonic screening tool.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<script>
  // Set the colour theme before the first paint (no flash). Same rules as src/theme/theme.js:
  // ?theme=light|dark (or ?light) for one visit, else the saved choice, else the system preference.
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      var m = q.get('theme');
      if (m !== 'light' && m !== 'dark') m = q.has('light') ? 'light' : null;
      if (!m) { try { m = localStorage.getItem('aeronet-theme'); } catch (e) { m = null; } }
      var dark = m === 'dark' || (m !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#080d1c');
    } catch (e) { /* the app sets the theme again once it loads */ }
  })();
</script>

</head>

</body>
</html>
